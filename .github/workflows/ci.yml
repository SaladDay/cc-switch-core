name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo +1.85.0 fmt --check
      - name: Run tests
        run: cargo +1.85.0 test --locked
      - name: Run Clippy
        run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1
        with:
          file: Cargo.lock
          createIssues: false
