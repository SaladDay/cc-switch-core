[package]
name = "cc-switch-store"
version = "0.1.0"
description = "Shared SQLite storage contracts for CC Switch applications"
license = "MIT"
repository = "https://github.com/SaladDay/cc-switch-core"
edition = "2021"
rust-version = "1.85.1"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
